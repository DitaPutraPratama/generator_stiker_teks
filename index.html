<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembuat Stiker Teks</title>
<style>
  :root {
    --bg: #f2f2f0; --panel: #ffffff; --ink: #1a1a1a; --muted: #6b6b6b;
    --line: #dcdcd8; --accent: #1a1a1a; --accent-ink: #ffffff; --check: #e9e9e6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161616; --panel: #222222; --ink: #ededed; --muted: #a0a0a0;
      --line: #3a3a3a; --accent: #ededed; --accent-ink: #161616; --check: #2c2c2c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161616; --panel: #222222; --ink: #ededed; --muted: #a0a0a0;
    --line: #3a3a3a; --accent: #ededed; --accent-ink: #161616; --check: #2c2c2c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  textarea {
    width: 100%; min-height: 110px; resize: vertical; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink);
    font: 18px/1.35 inherit; font-family: inherit;
  }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=range] { flex: 1; min-width: 140px; }
  select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--ink); padding: 7px 12px; cursor: pointer; font: inherit; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 400; margin: 8px 0 0; }
  .preview {
    aspect-ratio: 1 / 1; width: 100%; border-radius: 12px; display: grid; place-items: center;
    background-color: var(--check);
    background-image:
      linear-gradient(45deg, var(--line) 25%, transparent 25%),
      linear-gradient(-45deg, var(--line) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--line) 75%),
      linear-gradient(-45deg, transparent 75%, var(--line) 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0;
  }
  canvas { width: 100%; height: auto; display: block; }
  .btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    flex: 1; min-width: 130px; padding: 11px 14px; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 600;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .ex { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ex button {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px;
    padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <h1>Pembuat Stiker Teks</h1>

  <div class="wrap">
    <div class="card">
      <label for="teks">Teks</label>
      <textarea id="teks"></textarea>
      <div class="hint">Baris dipotong otomatis. Tekan Enter kalau mau memaksa ganti baris.</div>

      <label>Perataan</label>
      <div class="seg" id="rata">
        <button data-v="justify" class="on">Rata kanan-kiri</button>
        <button data-v="left">Kiri</button>
        <button data-v="center">Tengah</button>
      </div>

      <label for="font">Huruf</label>
      <div class="row">
        <select id="font">
          <option value='Arial, "Helvetica Neue", Helvetica, "Liberation Sans", sans-serif'>Arial / Helvetica</option>
          <option value='Roboto, "Segoe UI", system-ui, sans-serif'>Roboto / Sistem</option>
          <option value='Verdana, "DejaVu Sans", sans-serif'>Verdana</option>
          <option value='"Times New Roman", Times, serif'>Times</option>
          <option value='"Comic Sans MS", "Comic Neue", cursive'>Comic Sans</option>
        </select>
        <label class="check" style="margin:0"><input type="checkbox" id="tebal"> Tebal</label>
      </div>

      <label for="pad">Jarak tepi <span id="padV"></span></label>
      <input type="range" id="pad" min="10" max="90" value="34">

      <label for="lh">Jarak antar baris <span id="lhV"></span></label>
      <input type="range" id="lh" min="85" max="150" value="112">

      <label class="check"><input type="checkbox" id="sudut" checked> Sudut membulat (luar kotak transparan)</label>
      <label class="check"><input type="checkbox" id="rataAkhir" checked> Baris terakhir ikut rata kanan-kiri</label>
    </div>

    <div class="card">
      <div class="preview"><canvas id="cv" width="512" height="512"></canvas></div>
      <div class="btns">
        <button class="btn" id="dlPng">Unduh PNG</button>
        <button class="btn ghost" id="dlWebp">Unduh WebP (stiker WA)</button>
      </div>
    </div>
  </div>
</main>

<script>
const S = 512;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const el = id => document.getElementById(id);
let align = 'justify';

function setFont(size) {
  ctx.font = `${el('tebal').checked ? 'bold ' : ''}${size}px ${el('font').value}`;
}

// Bungkus kata secara rakus untuk lebar tertentu; Enter dihormati sebagai ganti baris paksa.
function wrap(text, maxW) {
  const out = [];
  const space = ctx.measureText(' ').width;
  for (const para of text.split('\n')) {
    const words = para.trim().split(/\s+/).filter(Boolean);
    if (!words.length) { out.push({ words: [], forced: true }); continue; }
    let line = [], w = 0;
    for (const word of words) {
      const ww = ctx.measureText(word).width;
      if (ww > maxW) return null; // satu kata pun tidak muat → ukuran terlalu besar
      const next = line.length ? w + space + ww : ww;
      if (next <= maxW || !line.length) { line.push(word); w = next; }
      else { out.push({ words: line, forced: false }); line = [word]; w = ww; }
    }
    out.push({ words: line, forced: true });
  }
  return out;
}

function draw() {
  const text = el('teks').value.replace(/\r/g, '');
  const pad = +el('pad').value;
  const lhF = +el('lh').value / 100;
  el('padV').textContent = `(${pad}px)`;
  el('lhV').textContent = `(${lhF.toFixed(2)}×)`;

  ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = '#ffffff';
  if (el('sudut').checked) {
    ctx.beginPath(); ctx.roundRect(0, 0, S, S, 28); ctx.fill();
  } else {
    ctx.fillRect(0, 0, S, S);
  }
  if (!text.trim()) return;

  const maxW = S - pad * 2, maxH = S - pad * 2;

  // Cari ukuran huruf terbesar yang muat (pencarian biner).
  let lo = 6, hi = 400, best = null, bestSize = 6;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    setFont(mid);
    const lines = wrap(text, maxW);
    const h = lines ? (lines.length - 1) * mid * lhF + mid : Infinity;
    if (lines && h <= maxH) { best = lines; bestSize = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  if (!best) { setFont(6); best = wrap(text, maxW) || []; bestSize = 6; }
  setFont(bestSize);

  // Pakai ukuran tinggi huruf sebenarnya agar teks pas di tengah secara vertikal.
  const m = ctx.measureText('Hgjy');
  const asc = m.actualBoundingBoxAscent || bestSize * 0.75;
  const desc = m.actualBoundingBoxDescent || bestSize * 0.22;
  const lineH = bestSize * lhF;
  const blockH = (best.length - 1) * lineH + asc + desc;
  let y = (S - blockH) / 2 + asc;

  ctx.fillStyle = '#000000';
  ctx.textBaseline = 'alphabetic';
  const space = ctx.measureText(' ').width;
  best.forEach((ln, i) => {
    const words = ln.words;
    const isLast = i === best.length - 1;
    const widths = words.map(w => ctx.measureText(w).width);
    const total = widths.reduce((a, b) => a + b, 0) + space * Math.max(0, words.length - 1);
    const justify = align === 'justify' && words.length > 1 && (!isLast || el('rataAkhir').checked);
    let x = pad;
    if (justify) {
      const gap = (maxW - widths.reduce((a, b) => a + b, 0)) / (words.length - 1);
      words.forEach((w, k) => { ctx.fillText(w, x, y); x += widths[k] + gap; });
    } else {
      if (align === 'center') x = pad + (maxW - total) / 2;
      words.forEach((w, k) => { ctx.fillText(w, x, y); x += widths[k] + space; });
    }
    y += lineH;
  });
}

function namaFile(ext) {
  const t = el('teks').value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
  return `stiker-${t || 'teks'}.${ext}`;
}
function unduh(type, ext) {
  cv.toBlob(b => {
    if (!b) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = namaFile(ext);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, type, 0.95);
}
el('dlPng').onclick = () => unduh('image/png', 'png');
el('dlWebp').onclick = () => unduh('image/webp', 'webp');

el('rata').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  align = b.dataset.v;
  el('rata').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  el('rataAkhir').disabled = align !== 'justify';
  draw();
});
['teks', 'font', 'tebal', 'pad', 'lh', 'sudut', 'rataAkhir'].forEach(id => {
  el(id).addEventListener('input', draw);
  el(id).addEventListener('change', draw);
});
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(draw);
draw();
</script>
</body>
</html>
